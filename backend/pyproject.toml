[project]
name = "tubesomali-backend"
version = "0.1.0"
description = "TubeSomali backend scaffold (Phase 1). No translation, TTS, or caption retrieval."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app"]
