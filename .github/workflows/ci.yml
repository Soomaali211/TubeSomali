name: ci
on:
  push:
    branches: [phase1-scaffold]
  pull_request:
    branches: [phase1-scaffold]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    env: { REQUIRE_FASTAPI: "1" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install (hash-checked lock if present, else version-pinned constraints)
        run: |
          if [ -f requirements-dev.hashed.txt ]; then pip install --require-hashes -r requirements-dev.hashed.txt
          elif [ -f requirements-dev.lock ]; then echo "::warning::no hashed lock"; pip install -r requirements-dev.txt -c requirements-dev.lock
          else echo "::warning::no lock; install not reproducible"; pip install -r requirements-dev.txt; fi
      - name: Generate hashed lock (only when none is committed; printed to log)
        run: |
          if [ ! -f requirements-dev.hashed.txt ]; then
            pip install pip-tools
            pip-compile --generate-hashes --constraint requirements-dev.lock --strip-extras --quiet --no-header --no-annotate -o /tmp/hashed.txt requirements-dev.txt
            echo "=====LOCK-BEGIN====="; cat /tmp/hashed.txt; echo "=====LOCK-END====="
          fi
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q
      - run: python ../tools/guards/check_no_asr.py
      - run: python ../tools/guards/check_secrets.py
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install (npm ci if lockfile exists; otherwise npm install, which is NOT reproducible)
        run: |
          if [ -f package-lock.json ]; then npm ci; else echo "::warning::no lockfile; install not reproducible"; npm install; fi
      - name: Print generated lockfile (only when none is committed)
        run: |
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then echo "=====LOCK-BEGIN====="; cat package-lock.json; echo; echo "=====LOCK-END====="; fi
      - uses: actions/upload-artifact@v4
        with: { name: package-lock, path: frontend/package-lock.json }
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:core
      - run: npm run test:guards
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle
      - run: npm run check:boundaries
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tubesomali-backend backend
      - run: docker build -t tubesomali-frontend frontend
      - name: Backend container must refuse to start (non-loopback bind without LAN mode; fail-closed, transport undecided Q11/Q16)
        run: |
          set +e
          out=$(docker run --rm tubesomali-backend 2>&1); rc=$?
          echo "exit=$rc"; echo "$out"
          [ "$rc" -ne 0 ] && echo "$out" | grep -q "Configuration error"
  spike:
    # Phase 1b PREP only. Checks the harness code and synthetic fixtures. This is NOT an AT-SP execution and
    # NOT device evidence: headless desktop Chromium cannot show Android audio behaviour.
    runs-on: ubuntu-latest
    env: { REQUIRE_FFMPEG: "1" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install pytest==9.2.0 ruff==0.17.6
      - run: ruff check --config backend/pyproject.toml spike
      - run: ruff format --config backend/pyproject.toml --check spike
      - run: node --test spike/tests/core.test.mjs
      - run: python -m pytest spike/tests/test_fixtures.py -q -p no:cacheprovider
      - run: python spike/fixtures/generate.py --out spike/fixtures/out --minutes 0.5
      - name: Headless software smoke (Chromium)
        run: |
          npm install --no-save --prefix /tmp/pw playwright@1.59.0
          npx --prefix /tmp/pw playwright install --with-deps chromium
          NODE_PATH=/tmp/pw/node_modules node spike/tests/smoke.mjs
